<!--
  OTH Hößl – Letterhead-Header (Klausuren)
  =========================================
  Einbindung im YAML-Header:
    include-before-body: ../_templates/oth_hoessl_header.html

  Zum Anpassen pro Dokument nur die drei markierten Stellen unten ändern:
    1) Logo-Pfad          (falls Ordnerstruktur abweicht)
    2) Link + Name        (Kurs-/Modul-Link, Name)
    3) Fachzeile          (Modul-/Kursbezeichnung)
-->
<style>
  .oth-header {
    --oth-blue: #447099;
    --oth-blue-dark: #2c5171;
    --oth-blue-tint: #eef3f8;
    --oth-ink: #22282f;
    --oth-muted: #5b6470;
    --oth-faint: #8b93a0;
    --oth-border: #dde3ea;

    font-family: 'Lato', -apple-system, "Segoe UI", Arial, sans-serif;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    padding: 1.1rem 1.6rem;
    margin: 0 0 1.75rem 0;
    background: linear-gradient(135deg, #ffffff 0%, var(--oth-blue-tint) 140%);
    border: 1px solid var(--oth-border);
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(20, 30, 45, .04), 0 8px 24px -12px rgba(20, 30, 45, .18);
    position: relative;
    overflow: hidden;
  }

  .oth-header::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: linear-gradient(180deg, var(--oth-blue), var(--oth-blue-dark));
  }

  .oth-header__logo {
    height: 62px;
    width: auto;
    flex: none;
    display: block;
  }

  .oth-header__divider {
    width: 1px;
    align-self: stretch;
    background: var(--oth-border);
    flex: none;
  }

  .oth-header__text {
    min-width: 0;
  }

  .oth-header__eyebrow {
    margin: 0 0 .3rem;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--oth-blue);
  }

  .oth-header__name {
    margin: 0;
    font-size: 1.35rem;
    line-height: 1.25;
    font-weight: 700;
  }

  .oth-header__name a {
    color: var(--oth-ink);
    text-decoration: none;
    background-image: linear-gradient(var(--oth-blue), var(--oth-blue));
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0 2px;
    transition: background-size .2s ease, color .2s ease;
    padding-bottom: 1px;
  }

  .oth-header__name a:hover {
    color: var(--oth-blue-dark);
    background-size: 100% 2px;
  }

  .oth-header__subject {
    margin: .15rem 0 0;
    font-size: 1rem;
    color: var(--oth-muted);
  }

  @media (max-width: 620px) {
    .oth-header { flex-wrap: wrap; }
    .oth-header__divider { display: none; }
  }

  @media print {
    .oth-header {
      box-shadow: none;
      background: #fff;
      border: 1px solid #ccc;
    }
  }
</style>

<div class="oth-header">
  <!-- 1) Logo-Pfad ggf. anpassen -->
  <img class="oth-header__logo" src="../images/OTH_Logo_1col_pos_b.png" alt="Logo der OTH Regensburg">

  <div class="oth-header__divider"></div>

  <div class="oth-header__text">
    <p class="oth-header__eyebrow">OTH Regensburg &middot; Fakult&auml;t Business and Management</p>
    <!-- 2) Link + Name -->
    <h2 class="oth-header__name">
      <a href="https://elearning.oth-regensburg.de/course/view.php?id=1342">Prof. Dr. Wolfgang H&ouml;&szlig;l</a>
    </h2>
    <!-- 3) Fachzeile -->
    <p class="oth-header__subject">Internationale Finanzm&auml;rkte und Asset Management</p>
  </div>
</div>
